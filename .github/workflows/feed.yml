name: Build and commit feed

on:
  # Rebuild once a day.
  schedule:
    - cron: '0 7 * * *'
  # Allow manual runs from the Actions tab.
  workflow_dispatch:
  # Rebuild when the generator changes.
  push:
    branches: [main]

# Allow the workflow to commit the feed.
permissions:
  contents: write

# Only one run at a time, so two runs can’t race the same commit.
concurrency:
  group: feed
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: package.json

      - name: Run tests
        run: npm test

      - name: Generate feed
        run: npm run build

      # GitHub Pages serves the committed feed.xml from the repository root.
      # Committing it also keeps the repository active, so GitHub doesn’t
      # disable the schedule after 60 days of inactivity.
      - name: Commit feed
        run: |
          if [ -z "$(git status --porcelain feed.xml)" ]; then
            echo 'Feed unchanged, nothing to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add feed.xml
          git commit -m 'Update feed'
          git push
