name: Build and deploy feed

on:
  # Rebuild once a day.
  schedule:
    - cron: '0 7 * * *'
  # Allow manual runs from the Actions tab.
  workflow_dispatch:
  # Rebuild when the generator changes.
  push:
    branches: [main]

# Allow the workflow to commit the feed and publish to GitHub Pages.
permissions:
  contents: write
  pages: write
  id-token: write

# Only one deployment at a time; let a running deploy finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: package.json

      - name: Run tests
        run: npm test

      - name: Generate feed
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: public

      # Committing the feed keeps the repository active, so GitHub doesn’t
      # disable the schedule after 60 days of inactivity.
      - name: Commit feed
        run: |
          if [ -z "$(git status --porcelain public)" ]; then
            echo 'Feed unchanged, nothing to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public
          git commit -m 'Update feed'
          git push

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
